# Cas d'usage : assistant des commerciaux. Un dossier = un client × un
# produit × un commercial, avec une suite de réunions. Sur disque : un
# sous-répertoire par dossier, avec un dossier.yaml optionnel.
name: ventes
title: Assistant des commerciaux
description: >
  Analyser des suites de réunions client (réunion 1, 2, 3…) pour comprendre
  pourquoi un dossier a abouti ou non à une vente, par commercial et par
  produit, et préparer la réunion suivante.
entities:
  dossier:
    client:
      type: string
      required: true
    produit:
      type: string
      required: true
    commercial:
      type: string
      required: true
    issue:
      type: enum
      values: [en_cours, gagne, perdu, abandonne]
      required: true
      description: État du dossier à ce jour
  document:
    numero_reunion:
      type: integer
      required: true
      description: Rang de la réunion dans le dossier (1, 2, 3…)
    date:
      type: date
      required: true
    type_document:
      type: enum
      values: [compte_rendu, transcription, email, proposition, autre]
ingestion:
  dossier_file: dossier.yaml
  # Secondes entre deux relevés du watcher.
  watch_interval_s: 10
  # « reunion-2.transcript.md », « Réunion 3 - CR.docx »… donnent le numéro
  # de réunion quand le document ne le dit pas lui-même.
  filename_patterns:
    - 'r[ée]union[-_ ]*(?P<numero_reunion>\d+)'
  # Les réunions se rangent par numéro : pour un champ de dossier qui change
  # au fil des réunions (l'issue), la dernière réunion fait foi.
  document_order: numero_reunion
# Tailles en tokens du tokenizer BGE-M3 (lu dans le cache local, jamais
# téléchargé). Enfant = passage cherché et cité ; parent = section qui
# l'entoure, donnée à lire au LLM ; max_tokens = limite absolue, contexte compris.
chunking:
  size_tokens: 384
  overlap_pct: 10
  parent_size_tokens: 1536
  max_tokens: 2500
  tokenizer: BAAI/bge-m3
# Modèle d'embedding : un nom de configs/models.yaml (révision épinglée).
embedding:
  model: bge-m3
retrieval:
  dense_top_n: 50
  bm25_top_n: 50
  rrf_k: 60
  rerank_top_k: 10
