# Cas d'usage : réponses aux avis de l'autorité environnementale (MRAe)
# sur des projets soumis à étude d'impact. Squelette de l'étape 0 : les
# champs sont ceux que le pipeline MRAe de V5 utilisait implicitement.
name: mrae
title: Réponses aux avis MRAe
description: >
  Un dossier = un projet déposé (tomes d'étude d'impact, annexes, cartes).
  Une demande = une remarque de l'autorité à laquelle il faut répondre
  à partir du dossier, avec citations exactes (document, page).
entities:
  dossier:
    projet:
      type: string
      required: true
      description: Nom du projet (ex. parc éolien de …)
    porteur:
      type: string
      description: Porteur de projet
  document:
    tome:
      type: string
      description: Tome ou pièce du dossier (ex. Tome 4, Résumé non technique)
    nature:
      type: enum
      values: [etude_impact, resume_non_technique, annexe, carte, avis, autre]
      description: Nature de la pièce
ingestion:
  dossier_file: dossier.yaml
  # « …_tome_1_volet_projet.pdf », « Tome 4 - Milieu naturel.pdf » donnent
  # le tome (mesuré sur de vrais noms de fichiers d'études d'impact).
  filename_patterns:
    - 'tome[-_ ]*(?P<tome>\d+)'
# Tailles en tokens du tokenizer BGE-M3 (lu dans le cache local, jamais
# téléchargé). Enfant = passage cherché et cité ; parent = section qui
# l'entoure, donnée à lire au LLM ; max_tokens = limite absolue, contexte compris.
chunking:
  size_tokens: 512
  overlap_pct: 15
  parent_size_tokens: 1536
  max_tokens: 2500
  tokenizer: BAAI/bge-m3
retrieval:
  dense_top_n: 75
  bm25_top_n: 75
  rrf_k: 60
  rerank_top_k: 8
