# Services d'index pour le développement et les tests d'intégration :
# Qdrant (vecteurs) et OpenSearch (BM25), sur la machine locale seulement.
# Images épinglées par version ET par empreinte (digest) de la liste
# multi-architecture : la même image sur la 3080 Ti, l'A5000 (amd64) et le
# GX10 (arm64). Aucun « latest ».
#
#   docker compose -f docker/compose.services.yaml up -d --wait
#   docker compose -f docker/compose.services.yaml down
name: luciole-services

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    healthcheck:
      # L'image ne contient pas curl : on teste l'ouverture du port.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:3.8.0@sha256:fafe3fc3587088674669235575aa166228c48bdb940294a8cdbbc1da75236a40
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    environment:
      discovery.type: single-node
      # Service local, joignable seulement depuis cette machine (127.0.0.1).
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  qdrant-data:
  opensearch-data:
