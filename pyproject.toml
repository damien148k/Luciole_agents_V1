[project]
name = "luciole"
version = "1.0.0a0"
description = "Luciole_agents_V1 — plateforme souveraine de boucles agentiques par cas d'usage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "loguru>=0.7.2,<0.8",
    "pymupdf>=1.26,<2",
    "pymupdf4llm>=0.0.27,<2",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "tokenizers>=0.21,<0.23",
    "qdrant-client>=1.19.1,<1.20",
    "opensearch-py>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.28.1,<0.29",
]

[project.optional-dependencies]
# Greffon de mise en page de pymupdf4llm (modèle binaire, roues x86_64 et aarch64).
layout = ["pymupdf-layout>=1.26,<2"]
# OCR : tire PyTorch, installé par le profil matériel (Dockerfile), jamais en CI.
ocr = ["easyocr>=1.7.1,<2"]
# Embedder réel (BGE-M3) : PyTorch + sentence-transformers, jamais en CI.
# PyTorch de PyPI : CUDA inclus sous Linux (images Docker), processeur seul
# sous Windows.
embed = ["sentence-transformers>=6.1,<7", "torch>=2.14,<3"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luciole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests qui demandent Docker ou un GPU (machines de Damien)",
]
addopts = "-m 'not integration'"
filterwarnings = [
    # starlette 1.9 annonce le remplacement de httpx par httpx2 dans TestClient.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
