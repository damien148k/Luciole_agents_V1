[project]
name = "luciole"
version = "1.0.0a0"
description = "Luciole_agents_V1 — plateforme souveraine de boucles agentiques par cas d'usage"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "loguru>=0.7.2,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luciole"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests qui demandent Docker ou un GPU (machines de Damien)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
